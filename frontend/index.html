    <!-- Structured Data: Organization -->

      "@context": "https://schema.org",

        "contactType": "technical support"
      }
    }

    <!-- Structured Data: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TurfsyOTPs API",
      "operatingSystem": "All",
      "applicationCategory": "DeveloperApplication",
      "description": "REST API for sending phone verification OTP codes and transactional SMS notifications.",
      "offers": {
        "@type": "Offer",
        "price": "0.75",
        "priceCurrency": "INR",
        "description": "Pay as you go per successful OTP dispatch with auto-refund on delivery failures."
      }
    }
    </script>

    <!-- Structured Data: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is TurfsyOTPs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TurfsyOTPs is a developer-first transactional SMS and OTP verification REST API offering sub-second dispatch latency, wallet-based Razorpay billing, and zero recurring monthly fees."
          }
        },
        {
          "@type": "Question",
          "name": "How does wallet-based billing work on TurfsyOTPs?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Developers top up funds into their account wallet via Razorpay (UPI, Net Banking, Cards) and are billed atomically per OTP. There are no monthly commitments or expiration on wallet balances."
          }
        },
        {
          "@type": "Question",
          "name": "What happens if an OTP fails to deliver?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "TurfsyOTPs features automated failure detection. If upstream telecom routes cannot deliver the OTP, the deducted amount is automatically credited back to your account wallet ledger."
          }
        }
      ]
    }
    </script>
