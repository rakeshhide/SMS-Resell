<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Rounded White Badge Base -->
  <rect width="64" height="64" rx="16" fill="#ffffff" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(0, 0, 0, 0.08)" stroke-width="1.2" />

  <!-- Smartphone Body Outer Outline -->
  <rect x="17" y="8" width="30" height="48" rx="7.5" fill="#ffffff" stroke="#051e46" stroke-width="3" />

  <!-- Top Ear Speaker Pill -->
  <line x1="28" y1="13" x2="36" y2="13" stroke="#051e46" stroke-width="2.5" stroke-linecap="round" />

  <!-- 3 OTP Code Dots -->
  <circle cx="25" cy="29.5" r="2.5" fill="#051e46" />
  <circle cx="32" cy="29.5" r="2.5" fill="#051e46" />
  <circle cx="39" cy="29.5" r="2.5" fill="#051e46" />

  <!-- Bottom Chin Divider -->
  <line x1="17" y1="45" x2="47" y2="45" stroke="#051e46" stroke-width="2.2" />

  <!-- Home / Fingerprint Sensor -->
  <circle cx="32" cy="50.5" r="2" fill="#051e46" />

  <!-- Overlapping Green Verified Checkmark Badge -->
  <circle cx="44.5" cy="45.5" r="10.5" fill="#ffffff" />
  <circle cx="44.5" cy="45.5" r="8.8" fill="#00a516" />
  <path d="M40.5 45.8L43.2 48.5L48.8 42.8" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
