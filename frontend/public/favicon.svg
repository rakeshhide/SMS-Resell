<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="turfsyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Bubble Glow Gradient -->
    <linearGradient id="bubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="lightningGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Badge with Glass Inset -->
  <rect width="64" height="64" rx="16" fill="url(#turfsyBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="rgba(255, 255, 255, 0.16)" stroke-width="1.5" />

  <!-- Main SMS Message Bubble (Filled Translucent) -->
  <path
    d="M14 17C14 13.686 16.686 11 20 11H44C47.314 11 50 13.686 50 17V33C50 36.314 47.314 39 44 39H26L18 46V39H20C16.686 39 14 36.314 14 33V17Z"
    fill="url(#bubbleGrad)"
    fill-opacity="0.22"
    stroke="url(#bubbleGrad)"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- High-Speed Instant OTP Flash Lightning -->
  <path
    d="M34 17L23 30H32L28 43L41 28H32L34 17Z"
    fill="url(#lightningGrad)"
    filter="url(#softGlow)"
  />

  <!-- SMS Carrier Signal / Verification Dots -->
  <circle cx="21" cy="21" r="2" fill="#38bdf8" />
  <circle cx="21" cy="27" r="2" fill="#38bdf8" opacity="0.8" />
  <circle cx="21" cy="33" r="2" fill="#38bdf8" opacity="0.6" />

  <!-- Green Active Gateway Live Pulse -->
  <circle cx="48" cy="14" r="4.5" fill="#10b981" />
  <circle cx="48" cy="14" r="2.2" fill="#ffffff" />
</svg>